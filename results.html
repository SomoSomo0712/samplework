<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テスト結果</title>
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
    <style>
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background-color:#f4f7f6;color:#333;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:1em}
        .container{width:90%;max-width:700px;background-color:#fff;padding:2em;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,.1)}
        h1{color:#2c3e50;text-align:center}
        #results-container{text-align:left}
        #results-list{list-style-type:none;padding:0}
        #results-list li{background-color:#ecf0f1;padding:1em;border-radius:5px;margin-bottom:.5em}
    </style>
</head>
<body>
    <div class="container">
        <h1>テスト結果</h1>
        <p id="result-summary" style="text-align: center; font-size: 1.2em;"></p>
        <p id="submission-status" style="text-align: center;"></p>
        <div id="results-container">
            <ul id="results-list"></ul>
        </div>
    </div>

    <!-- (results.html の <div id="results-container">...</div> の直後から) -->
    <script>
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxadh6PcGugkDcfX3jCQ4Qy8qrDAPpjXGmW4Crd-jWRQFTKJ4JDZGOoGxQYJUGpvfCf/exec'; // ★★ 必ず書き換え ★★

        window.addEventListener('load', () => {
            const userInfo = JSON.parse(localStorage.getItem('quizUserInfo'));
            let userResults = JSON.parse(localStorage.getItem('quizUserResults'));
            // ▼▼▼【更新】新しいログを読み込む ▼▼▼
            const timeLogs = JSON.parse(localStorage.getItem('quizTimeLogs'));
            const pathLogArray = JSON.parse(localStorage.getItem('quizPathLog'));
            // ▲▲▲【更新】ここまで ▲▲▲

            if (!userInfo || !userResults) {
                document.body.innerHTML = '<h1>エラー: テストデータが見つかりませんでした。</h1>';
                return;
            }
            
            // ▼▼▼【更新】最終的なデータ整形 ▼▼▼
            // 1. userResultsに、計測した総計時間を挿入する
            userResults.forEach(result => {
                const totalTime = timeLogs[result.questionIndex] || 0;
                result.time = totalTime.toFixed(2);
            });
            
            // 2. 移動ログを一つの文字列に変換する
            const pathLog = pathLogArray ? pathLogArray.join(' -> ') : 'ログがありません';
            // ▲▲▲【更新】ここまで ▲▲▲

            // 結果の表示処理 (ここはほぼ変更なし)
            const resultsList = document.getElementById('results-list');
            const resultSummary = document.getElementById('result-summary');
            userResults.sort((a, b) => a.questionIndex - b.questionIndex);
            let score = 0;
            userResults.forEach(result => {
                if (result.isCorrect) score++;
                const li = document.createElement('li');
                const correctIndicator = result.isCorrect ? '✅' : '❌';
                li.innerHTML = `
                    <strong>Q${result.questionIndex + 1}: ${result.question.split(') ')[1]}</strong><br>
                    あなたの回答: ${result.answer} ${correctIndicator}<br>
                    滞在合計時間: ${result.time} 秒
                `;
                resultsList.appendChild(li);
            });
            const scorePercentage = (score / userResults.length) * 100;
            resultSummary.textContent = `正解数: ${score} / ${userResults.length} (${scorePercentage.toFixed(0)}%)`;

            // Googleスプレッドシートへの送信処理
            document.getElementById('submission-status').textContent = '結果を送信中...';
            const dataToSubmit = { userInfo, userResults, score, scorePercentage: `${scorePercentage.toFixed(0)}%`, pathLog };
            
            fetch(GAS_WEB_APP_URL, {
                method: 'POST', mode: 'no-cors', cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' }, redirect: 'follow',
                body: JSON.stringify(dataToSubmit)
            })
            .then(() => {
                document.getElementById('submission-status').textContent = '結果が正常に記録されました。';
                // ▼▼▼【更新】すべてのログを消去する ▼▼▼
                localStorage.removeItem('quizUserInfo');
                localStorage.removeItem('quizUserResults');
                localStorage.removeItem('quizLastViewedProblem');
                localStorage.removeItem('quizTimeLogs');
                localStorage.removeItem('quizPathLog');
            })
            .catch(error => { console.error('Error:', error); });
        });
    </script>
</body>
</html>
